<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | منصة الوفاء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --teal:     #0ea5a0;
  --teal-lt:  #2dd4bf;
  --teal-dim: rgba(14,165,160,0.15);
  --amber:    #f59e0b;
  --amber-lt: #fcd34d;
  --bg:       #050d0d;
  --bg2:      #0a1a1a;
  --card:     #0d1f1f;
  --border:   rgba(14,165,160,0.18);
  --text:     #e8f4f4;
  --muted:    #5a8a8a;
  --error:    #ef4444;
  --success:  #22c55e;
}

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Cairo',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  direction:rtl;
  overflow:hidden;
}

/* ─── BLOBS ─── */
.blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;animation:blobMove 12s ease-in-out infinite alternate;}
.blob1{width:500px;height:500px;background:rgba(14,165,160,0.12);top:-150px;right:-150px;}
.blob2{width:400px;height:400px;background:rgba(245,158,11,0.08);bottom:-100px;left:-100px;animation-delay:-6s;}
@keyframes blobMove{0%{transform:translate(0,0) scale(1);}100%{transform:translate(30px,40px) scale(1.1);}}

/* ─── NOISE ─── */
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.5;
}

/* ─── CARD ─── */
.login-wrap{
  position:relative;z-index:1;
  width:100%;max-width:440px;
  padding:20px;
  animation:fadeUp .6s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}

.login-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:40px 36px;
  box-shadow:0 40px 80px rgba(0,0,0,0.4);
}

/* ─── LOGO ─── */
.login-logo{text-align:center;margin-bottom:32px;}
.logo-icon{
  width:70px;height:70px;border-radius:20px;
  background:linear-gradient(135deg,var(--teal),var(--teal-lt));
  display:inline-flex;align-items:center;justify-content:center;
  font-size:2rem;margin-bottom:14px;
  box-shadow:0 0 40px rgba(14,165,160,0.4);
}
.login-logo h1{
  font-family:'Tajawal',sans-serif;
  font-size:1.6rem;font-weight:900;
  background:linear-gradient(135deg,var(--teal-lt),var(--amber-lt));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.login-logo p{color:var(--muted);font-size:0.82rem;margin-top:4px;}

/* ─── TABS ─── */
.tabs{
  display:flex;background:var(--bg);border-radius:12px;
  padding:4px;margin-bottom:28px;border:1px solid var(--border);
}
.tab{
  flex:1;padding:10px;border-radius:9px;
  border:none;background:transparent;
  color:var(--muted);font-family:'Cairo';font-size:0.88rem;font-weight:700;
  cursor:pointer;transition:all .25s;
}
.tab.active{
  background:linear-gradient(135deg,var(--teal),var(--teal-lt));
  color:#fff;box-shadow:0 4px 16px rgba(14,165,160,0.3);
}

/* ─── FORM ─── */
.form-group{margin-bottom:18px;}
.form-label{
  display:block;font-size:0.82rem;font-weight:700;
  color:var(--muted);margin-bottom:8px;
}
.input-wrap{position:relative;}
.input-wrap i{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:0.9rem;pointer-events:none;
}
.form-input{
  width:100%;padding:13px 40px 13px 16px;
  border-radius:12px;border:1.5px solid var(--border);
  background:var(--bg);color:var(--text);
  font-family:'Cairo';font-size:0.92rem;
  transition:border-color .2s,box-shadow .2s;
  outline:none;
}
.form-input:focus{
  border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(14,165,160,0.15);
}
.form-input::placeholder{color:var(--muted);}

/* ─── TOGGLE PASSWORD ─── */
.toggle-pass{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);cursor:pointer;font-size:0.9rem;
  background:none;border:none;pointer-events:all;
}

/* ─── SUBMIT BTN ─── */
.btn-submit{
  width:100%;padding:14px;border-radius:12px;
  background:linear-gradient(135deg,var(--teal),var(--teal-lt));
  color:#fff;font-family:'Cairo';font-size:1rem;font-weight:800;
  border:none;cursor:pointer;margin-top:8px;
  transition:transform .2s,box-shadow .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(14,165,160,0.4);}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none;}

/* ─── MESSAGES ─── */
.msg{
  padding:12px 16px;border-radius:10px;
  font-size:0.85rem;font-weight:700;
  margin-bottom:16px;display:none;
  align-items:center;gap:8px;
}
.msg.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--error);}
.msg.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:var(--success);}
.msg.show{display:flex;}

/* ─── LOADING SPINNER ─── */
.spinner{
  width:18px;height:18px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.3);
  border-top-color:#fff;
  animation:spin .7s linear infinite;
  display:none;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ─── BACK LINK ─── */
.back-link{
  text-align:center;margin-top:20px;
  font-size:0.82rem;color:var(--muted);
}
.back-link a{color:var(--teal-lt);text-decoration:none;font-weight:700;}
.back-link a:hover{text-decoration:underline;}

/* ─── FORGOT ─── */
.forgot{
  text-align:left;margin-top:6px;
  font-size:0.78rem;
}
.forgot a{color:var(--teal-lt);text-decoration:none;}

@media(max-width:480px){
  .login-card{padding:28px 20px;}
}
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="login-wrap">
  <div class="login-card">

    <!-- LOGO -->
    <div class="login-logo">
      <div class="logo-icon">⚗️</div>
      <h1>منصة الوفاء</h1>
      <p>مستر أحمد ذكي للعلوم والكيمياء</p>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">تسجيل الدخول</button>
      <button class="tab" onclick="switchTab('register')">حساب جديد</button>
    </div>

    <!-- ERROR / SUCCESS MSG -->
    <div class="msg error" id="errorMsg">
      <i class="fas fa-circle-exclamation"></i>
      <span id="errorText"></span>
    </div>
    <div class="msg success" id="successMsg">
      <i class="fas fa-circle-check"></i>
      <span id="successText"></span>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input class="form-input" type="email" id="loginEmail" placeholder="example@email.com">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input class="form-input" type="password" id="loginPass" placeholder="••••••••">
          <button class="toggle-pass" onclick="togglePass('loginPass', this)" type="button">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="forgot"><a href="#" onclick="resetPassword()">نسيت كلمة المرور؟</a></div>
      </div>
      <button class="btn-submit" id="loginBtn" onclick="doLogin()">
        <div class="spinner" id="loginSpinner"></div>
        <span id="loginBtnText"><i class="fas fa-right-to-bracket"></i> دخول</span>
      </button>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" style="display:none;">
      <div class="form-group">
        <label class="form-label">الاسم الكامل</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input class="form-input" type="text" id="regName" placeholder="الاسم بالكامل">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input class="form-input" type="email" id="regEmail" placeholder="example@email.com">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input class="form-input" type="password" id="regPass" placeholder="٨ أحرف على الأقل">
          <button class="toggle-pass" onclick="togglePass('regPass', this)" type="button">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">الصف الدراسي</label>
        <div class="input-wrap">
          <i class="fas fa-graduation-cap"></i>
          <select class="form-input" id="regGrade" style="padding-right:40px;cursor:pointer;">
            <option value="">اختار صفّك</option>
            <option value="first">أولى ثانوي — علوم متكاملة</option>
            <option value="second">تانية ثانوي — علوم متكاملة</option>
            <option value="third">تالتة ثانوي — كيمياء</option>
          </select>
        </div>
      </div>
      <button class="btn-submit" id="regBtn" onclick="doRegister()">
        <div class="spinner" id="regSpinner"></div>
        <span id="regBtnText"><i class="fas fa-user-plus"></i> إنشاء الحساب</span>
      </button>
      <p style="font-size:0.78rem;color:var(--muted);text-align:center;margin-top:12px;">
        بعد التسجيل هيتم مراجعة حسابك من المدرس قبل التفعيل
      </p>
    </div>

    <div class="back-link">
      <a href="index.html"><i class="fas fa-arrow-right"></i> الرجوع للصفحة الرئيسية</a>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCYnK9x6dwnRzxJQ0bIsvzvJC-DUkRhNR4",
  authDomain: "wafa-platform.firebaseapp.com",
  databaseURL: "https://wafa-platform-default-rtdb.firebaseio.com",
  projectId: "wafa-platform",
  storageBucket: "wafa-platform.firebasestorage.app",
  messagingSenderId: "1048094327886",
  appId: "1:1048094327886:web:a70ec2627048d0630f6f1f",
  measurementId: "G-TMH13X4Q9V"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// لو مسجل دخول خليه يروح للصفحة المناسبة
onAuthStateChanged(auth, async (user) => {
  if (user) {
    const userDoc = await getDoc(doc(db, "users", user.uid));
    if (userDoc.exists()) {
      const data = userDoc.data();
      if (data.role === 'admin') {
        window.location.href = 'admin.html';
      } else if (data.subscribed) {
        window.location.href = 'dashboard.html';
      } else {
        showError('حسابك تحت المراجعة، هيتم تفعيله قريباً ✅');
      }
    }
  }
});

// ─── LOGIN ───
window.doLogin = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;

  if (!email || !pass) { showError('من فضلك اكتب الإيميل وكلمة المرور'); return; }

  setLoading('login', true);
  hideMessages();

  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const userDoc = await getDoc(doc(db, "users", cred.user.uid));

    if (userDoc.exists()) {
      const data = userDoc.data();
      showSuccess('تم تسجيل الدخول! جاري التحويل...');
      setTimeout(() => {
        if (data.role === 'admin') {
          window.location.href = 'admin.html';
        } else if (data.subscribed) {
          window.location.href = 'dashboard.html';
        } else {
          showError('حسابك تحت المراجعة، تواصل مع المدرس على واتساب 01287490245');
          setLoading('login', false);
        }
      }, 1000);
    }
  } catch(e) {
    setLoading('login', false);
    const msgs = {
      'auth/user-not-found': 'الإيميل ده مش موجود',
      'auth/wrong-password': 'كلمة المرور غلط',
      'auth/invalid-email': 'الإيميل مش صحيح',
      'auth/too-many-requests': 'كتير أوي، استنى شوية وحاول تاني',
      'auth/invalid-credential': 'الإيميل أو كلمة المرور غلط',
    };
    showError(msgs[e.code] || 'حصل خطأ، حاول تاني');
  }
};

// ─── REGISTER ───
window.doRegister = async function() {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const grade = document.getElementById('regGrade').value;

  if (!name || !email || !pass || !grade) { showError('من فضلك اكمل كل البيانات'); return; }
  if (pass.length < 8) { showError('كلمة المرور لازم تكون ٨ أحرف على الأقل'); return; }

  setLoading('reg', true);
  hideMessages();

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db, "users", cred.user.uid), {
      name, email, grade,
      role: 'student',
      subscribed: false,
      createdAt: new Date().toISOString()
    });
    showSuccess('تم التسجيل! هيتم مراجعة حسابك وتفعيله قريباً 🎉');
    setLoading('reg', false);
  } catch(e) {
    setLoading('reg', false);
    const msgs = {
      'auth/email-already-in-use': 'الإيميل ده مسجل قبل كده',
      'auth/weak-password': 'كلمة المرور ضعيفة',
      'auth/invalid-email': 'الإيميل مش صحيح',
    };
    showError(msgs[e.code] || 'حصل خطأ، حاول تاني');
  }
};

// ─── RESET PASSWORD ───
window.resetPassword = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  if (!email) { showError('اكتب إيميلك الأول'); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    showSuccess('تم إرسال رابط إعادة التعيين على إيميلك ✅');
  } catch(e) {
    showError('الإيميل مش موجود أو في مشكلة');
  }
};

// ─── HELPERS ───
window.switchTab = function(tab) {
  const isLogin = tab === 'login';
  document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
  document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', isLogin ? i === 0 : i === 1);
  });
  hideMessages();
};

window.togglePass = function(id, btn) {
  const input = document.getElementById(id);
  const icon = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'fas fa-eye';
  }
};

function showError(msg) {
  document.getElementById('errorText').textContent = msg;
  document.getElementById('errorMsg').classList.add('show');
  document.getElementById('successMsg').classList.remove('show');
}

function showSuccess(msg) {
  document.getElementById('successText').textContent = msg;
  document.getElementById('successMsg').classList.add('show');
  document.getElementById('errorMsg').classList.remove('show');
}

function hideMessages() {
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('successMsg').classList.remove('show');
}

function setLoading(type, loading) {
  const btn = document.getElementById(type + 'Btn');
  const spinner = document.getElementById(type + 'Spinner');
  const text = document.getElementById(type + 'BtnText');
  btn.disabled = loading;
  spinner.style.display = loading ? 'block' : 'none';
  text.style.display = loading ? 'none' : 'block';
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('loginForm').style.display !== 'none') doLogin();
    else doRegister();
  }
});
</script>
</body>
</html>
